name: Daily Horror Content

on:
  workflow_dispatch:

jobs:
  generate-horror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python packages
        run: python -m pip install google-genai requests

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate AI Horror Story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_horror.py

      - name: Generate AI Voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_voice.py

      - name: Generate Horror Scenes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_scenes.py

      - name: Generate Horror Images
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python scripts/generate_images.py

      - name: Create Horror Video
        run: python scripts/create_video.py

      - name: Show Generated Files
        run: |
          echo "===== STORY ====="
          cat horror_story.txt

          echo "===== SCENES ====="
          cat scenes.json

          echo "===== AUDIO ====="
          ls -lh narration.wav

          echo "===== IMAGES ====="
          ls -lh images/

          echo "===== VIDEO ====="
          ls -lh horror_video.mp4

      - name: Upload Horror Content
        uses: actions/upload-artifact@v4
        with:
          name: horror-content
          path: |
            horror_story.txt
            narration.wav
            scenes.json
            images/
            horror_video.mp4