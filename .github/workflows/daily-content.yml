name: Daily Horror Content

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose content mode"
        required: true
        default: "new"
        type: choice
        options:
          - new
          - rebuild

jobs:
  generate-horror:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai requests

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ==========================================
      # NEW CONTENT - GEMINI
      # ==========================================

      - name: Generate AI Horror Story
        if: inputs.mode == 'new'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_horror.py

      - name: Gemini Cooldown After Story
        if: inputs.mode == 'new'
        run: |
          echo "Waiting 60 seconds before generating voice..."
          sleep 60

      - name: Generate AI Voice
        if: inputs.mode == 'new'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_voice.py

      - name: Gemini Cooldown After Voice
        if: inputs.mode == 'new'
        run: |
          echo "Waiting 60 seconds before generating scenes..."
          sleep 60

      - name: Generate Horror Scenes
        if: inputs.mode == 'new'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
       