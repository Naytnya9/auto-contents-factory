name: Daily Horror Content

on:
  workflow_dispatch:

jobs:
  generate-horror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Gemini SDK
        run: python -m pip install google-genai

      - name: Generate AI Horror Story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_horror.py

      - name: Generate AI Voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_voice.py

      - name: Generate Horror Scenes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_scenes.py

      - name: Show Generated Story
        run: cat horror_story.txt

      - name: Show Generated Scenes
        run: cat scenes.json

      - name: Check Audio File
        run: ls -lh narration.wav

      - name: Upload Horror Content
        uses: actions/upload-artifact@v4
        with:
          name: horror-content
          path: |
            horror_story.txt
            narration.wav
            scenes.json