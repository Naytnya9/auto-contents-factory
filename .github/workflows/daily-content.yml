name: Daily Horror Content

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "new = generate everything, rebuild = reuse previous content"
        required: true
        default: "rebuild"
        type: choice
        options:
          - new
          - rebuild

jobs:
  generate-horror:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: python -m pip install google-genai requests

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate AI Horror Story
        if: inputs.mode == 'new'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_horror.py

      - name: Generate AI Voice
        if: inputs.mode == 'new'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_voice.py

      - name: Generate Horror Scenes
        if: inputs.mode == 'new'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_scenes.py

      - name: Generate Horror Images
        if: inputs.mode == 'new'
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python scripts/generate_images.py

      - name: Download Previous Horror Content
        if: inputs.mode == 'rebuild'
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: daily-content.yml
          workflow_conclusion: success
          name: horror-content
          path: .
          search_artifacts: true
          skip_unpack: false

      - name: Create Horror Video
        run: python scripts/create_video.py

      - name: Show Generated Files
        run: |
          echo "===== STORY ====="
          cat horror_story.txt

          echo "===== SCENES ====="
          cat scenes.json

          echo "===== AUDIO ====="
          ls -lh narration.wav

          echo "===== IMAGES ====="
          ls -lh images/

          echo "===== VIDEO ====="
          ls -lh horror_video.mp4

      - name: Upload Horror Content
        uses: actions/upload-artifact@v4
        with:
          name: horror-content
          path: |
            horror_story.txt
            narration.wav
            scenes.json
            images/
            horror_video.mp4